# Render blueprint — deploy: https://dashboard.render.com/blueprints
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wearly
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: clothing-store-db
          property: connectionString
      - key: Jwt__Secret
        sync: false # set manually in dashboard
      - key: Frontend__BaseUrl
        value: https://wearly.onrender.com
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: VNPAY__TmnCode
        sync: false
      - key: VNPAY__HashSecret
        sync: false
      - key: VNPAY__CallbackUrl
        value: https://wearly.onrender.com/api/payments/vnpay/proceed-after-payment
      - key: Gemini__ApiKey
        sync: false
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromEmail
        sync: false

databases:
  - name: clothing-store-db
    plan: free
